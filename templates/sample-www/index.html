<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APK-Builder Demo</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --fg: #14161a;
    --muted: #626a75;
    --accent: #1f6feb;
    --border: #e3e6ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216;
      --card: #171b21;
      --fg: #e8eaed;
      --muted: #9aa4b1;
      --accent: #63a4ff;
      --border: #262c34;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; }
  dt { color: var(--muted); font-size: 14px; }
  dd { margin: 0; font-size: 14px; text-align: right; word-break: break-word; }
  button {
    appearance: none; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff;
    font: 600 15px/1 system-ui, sans-serif;
    padding: 13px 18px; width: 100%; cursor: pointer;
  }
  button:active { opacity: .85; }
  .count { font-size: 40px; font-weight: 700; text-align: center;
           margin: 4px 0 16px; font-variant-numeric: tabular-nums; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 22px; }
</style>
</head>
<body>

<h1>Es laeuft.</h1>
<div class="sub">Diese Seite kommt aus der APK selbst, ohne Internetverbindung.</div>

<div class="card">
  <h2>Zaehler mit localStorage</h2>
  <div class="count" id="count">0</div>
  <button id="inc">Hochzaehlen</button>
</div>

<div class="card">
  <h2>Geraet</h2>
  <dl>
    <dt>Bildschirm</dt><dd id="screen">-</dd>
    <dt>Pixeldichte</dt><dd id="dpr">-</dd>
    <dt>Sprache</dt><dd id="lang">-</dd>
    <dt>Online</dt><dd id="online">-</dd>
    <dt>WebView</dt><dd id="chrome">-</dd>
  </dl>
</div>

<footer>Erzeugt mit apk-builder</footer>

<script>
  var KEY = "demo.count";
  var countEl = document.getElementById("count");
  var n = parseInt(localStorage.getItem(KEY) || "0", 10);

  function render() { countEl.textContent = n; }
  render();

  document.getElementById("inc").addEventListener("click", function () {
    n += 1;
    localStorage.setItem(KEY, String(n));
    render();
  });

  document.getElementById("screen").textContent =
    window.screen.width + " x " + window.screen.height;
  document.getElementById("dpr").textContent = window.devicePixelRatio + "x";
  document.getElementById("lang").textContent = navigator.language;
  document.getElementById("online").textContent = navigator.onLine ? "ja" : "nein";

  var m = navigator.userAgent.match(/Chrome\/([\d.]+)/);
  document.getElementById("chrome").textContent = m ? ("Chromium " + m[1]) : "unbekannt";
</script>

</body>
</html>
